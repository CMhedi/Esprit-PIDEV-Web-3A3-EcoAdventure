controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

ai_bundle_controllers:
    resource:
        path: ../src/AiBundle/Controller/
        namespace: App\AiBundle\Controller
    type: attribute

# Explicit route so Twig path('app_reservation_disponibilite') always resolves (see ReservationController::disponibilite).
app_reservation_disponibilite:
    path: /reservation/disponibilite/{id}
    controller: App\Controller\ReservationController::disponibilite
    methods: [GET, HEAD]
