# config/services.yaml

parameters:
    messages_upload_directory: '%kernel.project_dir%/public/uploads'
    activite_resv_image_directory: '%kernel.project_dir%/public/ActivieResvImage'
    activite_resv_image_public_path: 'ActivieResvImage'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
