# config/services.yaml

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    messages_upload_directory: '%kernel.project_dir%/public/uploads'
    activite_resv_image_directory: '%kernel.project_dir%/public/ActivieResvImage'
    activite_resv_image_public_path: 'ActivieResvImage'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ===== NUTRITION API SERVICE =====
    App\Service\NutritionApiService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
        tags:
            - { name: 'monolog.logger', channel: 'nutrition' }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
